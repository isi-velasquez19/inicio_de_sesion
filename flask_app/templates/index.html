<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <table>
        <tr>
            <td valign="top">
                <form action="/registro" method="POST">
                    <h1>Registro</h1>
                    <table>
                        <tr>
                            <td><label for="nombre">Nombre:</label></td>
                            <td><input type="text" id="nombre" name="nombre"></td>
                        </tr>
                        <tr>
                            <td><label for="apellido">Apellido:</label></td>
                            <td><input type="text" id="apellido" name="apellido"></td>
                        </tr>
                        <tr>
                            <td><label for="email">Email:</label></td>
                            <td><input type="email" id="email" name="email"></td>
                        </tr>
                        <tr>
                            <td><label for="contrasena">Contraseña:</label></td>
                            <td><input type="password" id="contrasena" name="password"></td>
                        </tr>
                        <tr>
                            <td><label for="confirm_password">Conf. Contraseña:</label></td>
                            <td><input type="password" id="confirm_password" name="confirm_password"></td>
                        </tr>
                        <tr>
                            <td colspan="2"><button type="submit">Registrar</button></td>
                        </tr>
                    </table>
                </form>
            </td>
            <td valign="top">
                <form action="/login" method="POST">
                    <h1>Inicio de Sesión</h1>
                    <table>
                        <tr>
                            <td><label for="login_email">Email:</label></td>
                            <td><input type="email" id="login_email" name="email"></td>
                        </tr>
                        <tr>
                            <td><label for="login_password">Contraseña:</label></td>
                            <td><input type="password" id="login_password" name="password"></td>
                        </tr>
                        <tr>
                            <td colspan="2"><button type="submit">Iniciar Sesión</button></td>
                        </tr>
                    </table>
                </form>
            </td>
        </tr>
    </table>

</body>
</html>
